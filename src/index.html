<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipboard slots</title>
<style>
  :root {
    --bg: #14181f; --row: #1c222c; --text: #e6edf5; --muted: #7b8798;
    --key: #2a323f; --keyedge: #0d1015; --accent: #5fd4c4;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 14px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  .panel { margin: 6px; padding: 12px; background: var(--bg); border-radius: 14px; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 10px; }
  header b { font-weight: 600; font-size: 15px; }
  header span { color: var(--muted); font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--row); border-radius: 8px; min-height: 24px; }
  .cap { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px;
         background: var(--key); box-shadow: 0 2px 0 var(--keyedge); font-weight: 600; font-size: 13px; }
  .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.empty .txt { color: var(--muted); }
  li.next .cap { background: var(--accent); color: #0a1512; }
  li.next { outline: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .panel.off { opacity: .6; }
  .panel.off li.next { outline: none; }
  .panel.off li.next .cap { background: var(--key); color: var(--text); }
</style>
</head>
<body>
<div class="panel" id="panel">
  <header><b>Clipboard slots</b><span id="status">Loading</span></header>
  <ul id="list"></ul>
</div>
<script>
  const list = document.getElementById('list');
  const panel = document.getElementById('panel');
  const status = document.getElementById('status');

  function render(s) {
    panel.classList.toggle('off', !s.enabled);
    status.textContent = s.enabled ? 'On' : 'Paused';
    list.innerHTML = '';
    s.slots.forEach((t, i) => {
      const li = document.createElement('li');
      const cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = i + 1;
      const txt = document.createElement('span'); txt.className = 'txt';
      txt.textContent = t ? t.replace(/\s+/g, ' ') : 'Empty';
      if (!t) li.classList.add('empty');
      if (i === s.next) li.classList.add('next');
      li.append(cap, txt);
      list.append(li);
    });
  }

  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  listen('slots', e => render(e.payload));
  invoke('get_state').then(render);
</script>
</body>
</html>
